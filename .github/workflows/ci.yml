# CI for Meridian (working title). Free GitHub-hosted runners only, no secrets.
# Docs: docs/tools/README.md.
#
# Node is pinned to 24.19.0 because the golden hashes in qa/golden-hashes.json
# were recorded on it (ADR 0004); on any other Node major they are skipped.
# Every action is pinned to a full commit SHA with its version in a comment.
# To bump one: look up the tag's commit, replace the SHA and the comment.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA regression suite (Node 24.19.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      # No install step: qa/ and prototype/tools/ use Node built-ins only.
      - name: node qa/run-all.js
        run: node qa/run-all.js

  sim:
    name: Reference sim tests (Node 24.19.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      # No install step: sim/ uses Node built-ins only.
      - name: npm test --prefix sim
        run: npm test --prefix sim

  # The GDScript port against the JS reference sim's golden vectors. Godot is pinned
  # to 4.7.2 and its SHA-512 is verified before anything runs. The sim job above does
  # not set GODOT, so `npm test --prefix sim` skips its godot stage there and this job
  # is the only place the parity check runs. The .godot/ import cache is created on
  # the runner only (it is gitignored and never committed).
  godot-parity:
    name: GDScript parity (Godot 4.7.2 headless, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2-stable
      # SHA-512 of Godot_v4.7.2-stable_linux.x86_64.zip, from the release's SHA512-SUMS.txt.
      GODOT_ZIP_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Godot ${{ env.GODOT_VERSION }} (official release, checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "${GODOT_ZIP_SHA512}  godot.zip" | sha512sum -c -
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot
          ./godot --version
      # A fresh clone has no class cache: the import pass registers the class_name scripts.
      - name: Import project
        run: '"${RUNNER_TEMP}/godot" --headless --path . --import'
      - name: GDScript parity
        run: '"${RUNNER_TEMP}/godot" --headless --path . --script res://sim/core/tools/parity.gd'
